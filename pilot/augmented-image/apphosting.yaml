    secret: API_KEY
  - variable: VITE_GOOGLE_MAPS_API_KEY
    secret: VITE_GOOGLE_MAPS_API_KEY
  - variable: VITE_BACKEND_URL
    secret: BACKEND_URL
  - variable: VITE_DATADOG_APPLICATION_ID
    value: "5dbfaf08-4635-42e2-8420-9d9e91592888"
