# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # Grant access to secrets in Cloud Secret Manager.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  - variable: VITE_API_KEY
    secret: API_KEY
  - variable: VITE_GOOGLE_MAPS_API_KEY
    secret: VITE_GOOGLE_MAPS_API_KEY
  - variable: VITE_BACKEND_URL
    secret: BACKEND_URL
  - variable: VITE_DATADOG_APPLICATION_ID
    secret: DATADOG_APPLICATION_ID
  - variable: VITE_DATADOG_CLIENT_TOKEN
    secret: DATADOG_CLIENT_TOKEN
  - variable: VITE_DATADOG_SITE
    secret: DATADOG_SITE
  - variable: VITE_DATADOG_SERVICE
    secret: DATADOG_SERVICE
