name: Agent Evaluation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  evaluate-agent:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    env:
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_LOCATION: us-central1
      AGENT_ENGINE_ID: ${{ secrets.AGENT_ENGINE_ID }}
      # Use a standard multimodal model for evaluation as the live audio model
      # does not support the generateContent API used by the test runner.
      AGENT_MODEL: "gemini-1.5-pro-002"
      INTERNAL_MODEL: "gemini-1.5-pro-002"

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies and Run Evaluation
      working-directory: ./pilot
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install uv
        uv pip install setuptools wheel
        # Install the package with test extras (pytest, sentence-transformers)
        uv pip install ".[test]"
        
        # Run the evaluation pipeline
        pytest evaluation/test_evaluation_pipeline.py -v
