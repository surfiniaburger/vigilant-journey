<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gesture Control Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: 'Inter', sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #video-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 240px;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #3b82f6;
            transform: scaleX(-1);
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            color: white;
            width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gesture-indicator {
            position: absolute;
            bottom: 210px;
            right: 20px;
            color: #3b82f6;
            font-weight: bold;
            text-align: right;
        }
    </style>
</head>

<body>

    <div id="canvas-container"></div>

    <!-- UI Panel -->
    <div class="ui-panel">
        <h1 class="text-xl font-bold mb-4 bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
            Gravity Showcase</h1>

        <div class="mb-4">
            <label class="block text-[10px] uppercase tracking-wider mb-2 text-gray-500 font-bold">Model Source</label>
            <input type="file" id="file-upload" accept=".glb,.gltf"
                class="block w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 pointer-events-auto cursor-pointer transition-colors">
        </div>

        <div class="space-y-3 mb-6">
            <label class="block text-[10px] uppercase tracking-wider text-gray-500 font-bold">Experience
                Controls</label>

            <button id="btn-clock-mode"
                class="w-full py-2 px-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs flex items-center justify-between group transition-all">
                <span>🕰️ Gravity Clock Mode</span>
                <div class="w-2 h-2 rounded-full bg-gray-600 group-[.active]:bg-green-500 transition-colors"></div>
            </button>

            <button id="btn-car-paint"
                class="w-full py-2 px-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs flex items-center justify-between group transition-all">
                <span>✨ Apply Liquid Polish</span>
                <span class="text-[10px] opacity-0 group-hover:opacity-100 transition-opacity">Clearcoat</span>
            </button>

            <div class="flex items-center justify-between gap-2">
                <input type="color" id="color-picker" value="#3b82f6"
                    class="flex-1 h-8 rounded cursor-pointer bg-transparent border-none">
                <span class="text-[10px] text-gray-400">Base Color</span>
            </div>
        </div>

        <div class="pt-4 border-t border-white/10">
            <p class="font-bold text-blue-400 text-xs mb-2">Hand Gestures</p>
            <ul class="list-disc ml-4 text-[10px] text-gray-400 space-y-1">
                <li>👆 Index Move: Rotate</li>
                <li>👌 Pinch: Scale / Zoom</li>
                <li>🖐️ Open Palm: Reset Position</li>
            </ul>
        </div>
    </div>

    <!-- Feedback UI -->
    <div class="gesture-indicator" id="gesture-status">Waiting for Hands...</div>

    <!-- Hidden Video for Tracking -->
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <!-- Import Maps for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Configuration & State ---
        let scene, camera, renderer, controls, currentModel;
        let video, handLandmarker;
        let lastVideoTime = -1;

        // Features
        let isClockMode = false;
        let clockGroup = new THREE.Group(); // Wrapper for clock rotation

        const gestureStatus = document.getElementById('gesture-status');

        // --- MediaPipe Hand Tracking Setup ---
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

        async function initMediaPipe() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2
            });
            startCamera();
        }

        async function startCamera() {
            video = document.getElementById("webcam");
            const constraints = { video: { width: 640, height: 480 } };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.addEventListener("loadeddata", predictWebcam);
        }

        // --- Three.js Setup ---
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505); // Deep dark grey
            scene.fog = new THREE.Fog(0x050505, 10, 50);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 6);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // --- Showroom Environment ---

            // 1. Grid Floor (Infinite-ish look)
            const gridHelper = new THREE.GridHelper(50, 50, 0x333333, 0x111111);
            scene.add(gridHelper);

            // 2. Reflective Floor Plane (Simulated)
            const planeGeometry = new THREE.PlaneGeometry(100, 100);
            const planeMaterial = new THREE.MeshStandardMaterial({
                color: 0x0a0a0a,
                roughness: 0.1,
                metalness: 0.5
            });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = -0.01; // Just below grid
            plane.receiveShadow = true;
            scene.add(plane);

            // 3. Studio Lighting
            // Key Light (Warm)
            const spotLight = new THREE.SpotLight(0xffffff, 200);
            spotLight.position.set(5, 8, 5);
            spotLight.angle = Math.PI / 4;
            spotLight.penumbra = 0.5;
            spotLight.castShadow = true;
            spotLight.shadow.bias = -0.0001;
            scene.add(spotLight);

            // Fill Light (Cool)
            const fillLight = new THREE.PointLight(0x4455ff, 50);
            fillLight.position.set(-5, 3, 5);
            scene.add(fillLight);

            // Rim Light (Back)
            const rimLight = new THREE.SpotLight(0xffffff, 100);
            rimLight.position.set(0, 5, -5);
            rimLight.lookAt(0, 0, 0);
            scene.add(rimLight);

            scene.add(new THREE.AmbientLight(0xffffff, 0.2));

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent going below floor

            // Scene Graph for Features
            scene.add(clockGroup);

            // Default Placeholder (Cube)
            const geometry = new THREE.BoxGeometry(1, 0.5, 2);
            const material = new THREE.MeshPhysicalMaterial({
                color: 0x3b82f6,
                metalness: 0.6,
                roughness: 0.2,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });
            currentModel = new THREE.Mesh(geometry, material);
            currentModel.position.y = 0.5; // Sit on floor
            currentModel.castShadow = true;
            clockGroup.add(currentModel);

            window.addEventListener('resize', onWindowResize);
        }

        // --- Logic: Map Gestures to 3D ---
        function handleGestures(results) {
            if (isClockMode) return; // Gestures disabled in Clock Mode (or could be mapped differently)

            if (results.landmarks && results.landmarks.length > 0) {
                gestureStatus.innerText = "🖐️ Tracking Active";
                gestureStatus.style.color = "#3b82f6";

                const hand1 = results.landmarks[0];

                // 1. Rotation (Index Finger)
                const indexFinger = hand1[8];
                // Smooth interpolation could go here, but direct mapping for responsiveness
                clockGroup.rotation.y = (indexFinger.x - 0.5) * 5;
                clockGroup.rotation.x = (indexFinger.y - 0.5) * 2;

                // 2. Scaling (Pinch)
                const thumb = hand1[4];
                const distance = Math.sqrt(
                    Math.pow(indexFinger.x - thumb.x, 2) +
                    Math.pow(indexFinger.y - thumb.y, 2)
                );

                const scale = Math.max(0.5, distance * 5);
                clockGroup.scale.set(scale, scale, scale);

            } else {
                gestureStatus.innerText = "📷 Waiting for Hand...";
                gestureStatus.style.color = "#666";
            }
        }

        async function predictWebcam() {
            let startTimeMs = performance.now();
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                const results = handLandmarker.detectForVideo(video, startTimeMs);
                handleGestures(results);
            }
            requestAnimationFrame(predictWebcam);
        }

        // --- Feature Interactions ---

        // 1. File Upload
        document.getElementById('file-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const url = URL.createObjectURL(file);

            const loader = new GLTFLoader();
            loader.load(url, (gltf) => {
                clockGroup.remove(currentModel);
                currentModel = gltf.scene;

                // Center & Scale normalization
                const box = new THREE.Box3().setFromObject(currentModel);
                const size = box.getSize(new THREE.Vector3()).length();
                const center = box.getCenter(new THREE.Vector3());

                currentModel.position.x += (currentModel.position.x - center.x);
                currentModel.position.z += (currentModel.position.z - center.z);
                currentModel.position.y = -box.min.y; // Sit exactly on zero

                // Auto-scale to fit nicely
                const scaleFactor = 3 / size;
                currentModel.scale.set(scaleFactor, scaleFactor, scaleFactor);

                currentModel.traverse(node => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });

                clockGroup.add(currentModel);

                // Reset rotation
                clockGroup.rotation.set(0, 0, 0);
            });
        });

        // 2. Color Picker
        document.getElementById('color-picker').addEventListener('input', (e) => {
            const color = e.target.value;
            if (currentModel) {
                currentModel.traverse((node) => {
                    if (node.isMesh && (node.name.toLowerCase().includes('body') || node.name.toLowerCase().includes('paint') || !node.name.includes('glass'))) {
                        // Heuristic: Don't paint glass/windows if possible
                        if (node.material && node.material.color) {
                            node.material.color.set(color);
                        }
                    }
                });
            }
        });

        // 3. Gravity Clock Mode
        document.getElementById('btn-clock-mode').addEventListener('click', (e) => {
            isClockMode = !isClockMode;
            const btn = e.currentTarget;

            if (isClockMode) {
                btn.classList.add('active');
                btn.querySelector('div').classList.remove('bg-gray-600');
                btn.querySelector('div').classList.add('bg-green-500');

                // Flip Upside Down
                // We animate the Z rotation to 180 (PI)
                new TWEEN.Tween(clockGroup.rotation)
                    .to({ z: Math.PI }, 1000)
                    .easing(TWEEN.Easing.Back.Out)
                    .start();

            } else {
                btn.classList.remove('active');
                btn.querySelector('div').classList.add('bg-gray-600');
                btn.querySelector('div').classList.remove('bg-green-500');

                // Reset Upright
                new TWEEN.Tween(clockGroup.rotation)
                    .to({ z: 0, x: 0, y: 0 }, 1000)
                    .easing(TWEEN.Easing.Back.Out)
                    .start();
            }
        });

        // 4. Liquid Polish (Car Paint)
        document.getElementById('btn-car-paint').addEventListener('click', () => {
            if (currentModel) {
                currentModel.traverse((node) => {
                    if (node.isMesh) {
                        // Create a premium Car Paint material
                        // Preserve original color if possible
                        const oldColor = node.material.color ? node.material.color.clone() : new THREE.Color(0xffffff);

                        node.material = new THREE.MeshPhysicalMaterial({
                            color: oldColor,
                            metalness: 0.6,
                            roughness: 0.2,
                            clearcoat: 1.0,
                            clearcoatRoughness: 0.05,
                            envMapIntensity: 1.5
                        });
                        node.material.needsUpdate = true;
                    }
                });
            }
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Simple Tweening Lib for smooth transitions (inlined for speed) ---
        // (Note: Adding a proper tween lib via importmap would be better, but implementing a tiny one here for now)
        // Actually, let's just use simple linear interpolation in animate for simplicity if no lib.
        // Wait, I used 'TWEEN' above. I need to include it or write a simple lerp.
        // I'll import TWEEN from CDN.

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            TWEEN.update();

            // Clock Logic
            if (isClockMode) {
                const now = new Date();
                const seconds = now.getSeconds() + (now.getMilliseconds() / 1000);

                // Rotate like a second hand (6 degrees per second)
                // -Z axis because it's upside down? Let's just rotate Y local.
                // If it's upside down (Z=PI), local Y rotation spins it like a top hanging from ceiling.

                const angle = -(seconds / 60) * Math.PI * 2;
                clockGroup.rotation.y = angle;
            }

            renderer.render(scene, camera);
        }

        // Initialize
        initScene();
        initMediaPipe();
        animate();
    </script>

    <!-- Add Tween.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</body>

</html>
